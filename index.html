<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <meta
      name="description"
      content="Live Tempest observations, regional radar, and National Weather Service forecasts."
    >
    <title>Tempest Weather Station</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to weather data</a>
    <div class="route-progress" id="route-progress" aria-hidden="true"></div>

    <main class="shell weather-app" id="main-content">
      <h1 class="visually-hidden">Tempest weather dashboard</h1>
      <time class="last-refresh" id="last-refresh">Last refresh —</time>
      <div class="notice notice--error" id="page-error" role="alert" hidden></div>
      <div class="notice" id="section-warnings" role="status" hidden></div>

      <section class="current-hero" aria-label="Current conditions">
        <div class="current-column current-column--temperature">
          <p class="hero-temperature" id="hero-temperature">—°</p>
          <p class="hero-feels">Feels like <strong id="hero-feels">—°</strong></p>
          <div class="current-metrics">
            <p><span aria-hidden="true">◒</span><strong id="hero-humidity">—</strong> humidity</p>
            <p><span aria-hidden="true">◴</span><strong id="hero-pressure">—</strong></p>
            <p><span aria-hidden="true">ϟ</span><strong id="hero-lightning">—</strong></p>
          </div>
        </div>

        <div class="current-column current-column--condition">
          <div class="weather-icon weather-icon--large weather-icon--clear" id="hero-icon" aria-hidden="true"></div>
          <p class="hero-condition" id="hero-condition">Loading</p>
          <div class="current-metrics current-metrics--right">
            <p><span aria-hidden="true">◒</span><strong id="hero-wind">—</strong></p>
            <p><span aria-hidden="true">☀</span><strong id="hero-uv">—</strong> UV</p>
            <p><span aria-hidden="true">●</span><strong id="hero-rain">—</strong></p>
          </div>
        </div>
      </section>

      <section class="radar-panel" aria-label="Synchronized four-hour satellite and rain loop">
        <figure class="imagery-frame" aria-live="polite">
          <div class="imagery-stage" id="imagery-stage">
            <img class="imagery-base" id="satellite-image" alt="GOES GeoColor satellite view centered on regional">
            <img class="weather-overlay" id="radar-image" alt="" aria-hidden="true">
            <img class="reference-map" id="radar-reference" alt="" aria-hidden="true">
            <span class="map-marker" id="satellite-marker" aria-label="regional"></span>
            <div class="imagery-loader" id="imagery-loader">
              <span></span>
              <p>Loading matched satellite and radar frames</p>
            </div>
            <figcaption id="satellite-time">Preparing synchronized imagery…</figcaption>
          </div>
          <div class="imagery-timeline">
            <div class="timeline" id="timeline" hidden>
              <label class="visually-hidden" for="timeline-range">Loop position</label>
              <input id="timeline-range" type="range" min="0" max="23" value="0" step="1">
              <output id="timeline-output" for="timeline-range">1 / 24</output>
            </div>
            <p class="visually-hidden" id="satellite-status" aria-live="polite">Contacting NOAA satellite and IEM radar services…</p>
          </div>
        </figure>
      </section>

      <section class="forecast-board" aria-labelledby="forecast-title">
        <h2 class="visually-hidden" id="forecast-title">Weather forecast</h2>
        <div id="daily-primary"></div>
        <div class="hourly-strip" id="hourly-forecast" aria-label="12-hour forecast"></div>
        <div id="daily-secondary"></div>
        <details class="forecast-details">
          <summary>Detailed 12-hour forecast</summary>
          <div class="table-scroll" id="forecast-detail-table"></div>
        </details>
      </section>

      <details class="station-details">
        <summary>Station details</summary>
        <div class="detail-grid" id="condition-sections"></div>
      </details>
    </main>

    <noscript><div class="noscript">JavaScript is required to display the generated weather data.</div></noscript>
  </body>
</html>
