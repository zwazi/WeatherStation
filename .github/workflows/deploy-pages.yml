name: Refresh weather and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_sha: ${{ steps.stamp.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install builder dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Test data builder
        run: python -m unittest discover -s tests -v

      - name: Refresh all weather sections
        env:
          TEMPEST_TOKEN: ${{ secrets.TEMPEST_TOKEN }}
          TEMPEST_STATION_ID: ${{ vars.TEMPEST_STATION_ID || '217249' }}
          TEMPEST_DEVICE_ID: ${{ vars.TEMPEST_DEVICE_ID || '1221453' }}
        run: python scripts/update_weather.py

      - name: Check browser JavaScript
        run: node --check assets/app.js

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets data _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Stamp a unique build version
        id: stamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD
          git commit --allow-empty -m "Refresh weather data [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_SHA: ${{ needs.build.outputs.build_sha }}
