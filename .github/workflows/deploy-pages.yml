name: Refresh weather and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "1,11,21,31,41,51 * * * *"
      timezone: "America/Phoenix"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test data builder
        run: python -m unittest discover -s tests -v

      - name: Refresh all weather sections
        env:
          TEMPEST_TOKEN: ${{ secrets.TEMPEST_TOKEN }}
          TEMPEST_STATION_ID: ${{ vars.TEMPEST_STATION_ID || '217249' }}
          TEMPEST_DEVICE_ID: ${{ vars.TEMPEST_DEVICE_ID || '1221453' }}
        run: python scripts/update_weather.py

      - name: Check browser JavaScript
        run: node --check assets/app.js

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets data _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
