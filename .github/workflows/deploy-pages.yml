name: Refresh weather and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_sha: ${{ steps.stamp.outputs.sha }}
      refresh_errors: ${{ steps.health.outputs.errors }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install builder dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Test data builder
        run: python -m unittest discover -s tests -v

      - name: Refresh all weather sections
        env:
          TEMPEST_TOKEN: ${{ secrets.TEMPEST_TOKEN }}
          TEMPEST_STATION_ID: ${{ secrets.TEMPEST_STATION_ID }}
          TEMPEST_DEVICE_ID: ${{ secrets.TEMPEST_DEVICE_ID }}
        run: python scripts/update_weather.py

      - name: Record refresh health
        id: health
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          errors = json.loads(Path("data/weather.json").read_text()).get("errors", {})
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"errors={','.join(errors)}\n")
          for section in errors:
              print(f"::warning::Weather section failed to refresh: {section}")
          PY

      - name: Check browser JavaScript
        run: node --check assets/app.js

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets data _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Stamp a unique build version
        id: stamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD
          git commit --allow-empty -m "Refresh weather data [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_SHA: ${{ needs.build.outputs.build_sha }}

      - name: Report incomplete weather refresh
        if: needs.build.outputs.refresh_errors != ''
        env:
          REFRESH_ERRORS: ${{ needs.build.outputs.refresh_errors }}
        run: |
          echo "::error::Deployed available weather data, but these sections failed to refresh: $REFRESH_ERRORS"
          exit 1
